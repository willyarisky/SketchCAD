[package]
name = "sc_skp"
version.workspace = true
edition.workspace = true

# The converter runs as its own process so it can match the SketchUp library's CPU architecture
# (SketchUp 2017's library is Intel-only; it runs under Rosetta on Apple Silicon).
[[bin]]
name = "sketchcad-skp"
path = "src/bin/sketchcad-skp/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
libloading = "0.8.9"
