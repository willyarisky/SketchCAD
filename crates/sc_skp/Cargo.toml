[package]
name = "sc_skp"
version.workspace = true
edition.workspace = true

# The converter runs as its own process so it can match the SketchUp library's CPU architecture
# (SketchUp 2017's library is Intel-only; it runs under Rosetta on Apple Silicon).
[[bin]]
name = "sketchcad-skp"
path = "src/bin/sketchcad-skp/main.rs"

# Reads .skp containers directly, with no SketchUp library involved.
[[bin]]
name = "skp-inspect"
path = "src/bin/skp-inspect.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
libloading = "0.8.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
