[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sc_math = { path = "crates/sc_math" }
sc_geom = { path = "crates/sc_geom" }
sc_render = { path = "crates/sc_render" }
sc_skp = { path = "crates/sc_skp" }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
slotmap = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.36"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2
